services:
  mc-controller:
    image: ${DOCKER_HUB_USERNAME:?Set DOCKER_HUB_USERNAME}/mc-controller:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - NUXT_MC_RUNTIME=docker
      - DATABASE_PATH=/data/mc-controller.db
      - MC_DATA_PATH=/data/servers
      - MC_DATA_HOST_PATH=${MC_DATA_HOST_PATH}
      # Applied to each Minecraft container created by the controller.
      - MC_BIND_IP=${MC_BIND_IP:-0.0.0.0}
      - PORT_RANGE_START=${PORT_RANGE_START:-25565}
      - PORT_RANGE_END=${PORT_RANGE_END:-25600}
      - CURSEFORGE_API_KEY=${CURSEFORGE_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - DOCKER_SOCKET=/var/run/docker.sock
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    volumes:
      - ${MC_DATA_HOST_PATH}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/setup/status"]
      interval: 30s
      timeout: 10s
      retries: 5
