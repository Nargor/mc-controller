version: '3.9'

services:
  mc-controller:
    image: ${DOCKER_HUB_USERNAME}/mc-controller:latest
    environment:
      - NODE_ENV=production
      - NUXT_MC_RUNTIME=docker
      - DATABASE_PATH=/data/mc-controller.db
      - MC_DATA_PATH=/data/servers
      - MC_DATA_HOST_PATH=${MC_DATA_HOST_PATH}
      - PORT_RANGE_START=${PORT_RANGE_START:-25565}
      - PORT_RANGE_END=${PORT_RANGE_END:-25600}
      - CURSEFORGE_API_KEY=${CURSEFORGE_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - DOCKER_SOCKET=/var/run/docker.sock
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    volumes:
      - ${MC_DATA_HOST_PATH}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
      - "25565-25600:25565-25600"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/setup/status"]
      interval: 30s
      timeout: 10s
      retries: 5
